<!DOCTYPE html>

<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Wild River Adventures for rafting reservations, questions, and information about our white water rafting experiences.">

    <meta name="author" content="Ruben Astvatsaturov">

    <title>Contact Us | Wild River Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>

    <header>
        <img src="images/rafting-logo.png" alt="Wild River Adventures logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>

            <p>
                123 River Road, Street ID 83702<br>
                Boise, Idaho<br>
                +1 (801) 555-0147<br>
                info@wildriveradventures.com
            </p>
        </section>

        <section class="contact-content">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps?q=Boise%20River%2C%20Boise%2C%20Idaho&output=embed"
                  width="600"
                  height="350"
                  loading="lazy"
                  title="Map showing our location">
                </iframe>
            </div>

            <form action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>

                <textarea id="message" name="message" rows="6" placeholder="Type your message"
                  required></textarea>

                <label class="newsletter" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employees-section">

            <h2>We Are Here To Serve You</h2>

            <div class="employees">

                <figure>
                    <img src="images/employee1.jpg" alt="Alex Johnson, River Guide">
                    <figcaption>
                        Alex Johnson<br>
                        River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Sarah Miller, Safety Coordinator">
                    <figcaption>
                        Sarah Miller<br>
                        Safety Coordinator
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Michael Brown, Operations Manager">
                    <figcaption>
                        Michael Brown<br>
                        Operations Manager
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 Wild River Adventures | Ruben Astvatsaturov</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg.png" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg.png" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg.png" alt="Instagram Icon">
            </a>

        </nav>

    </footer>

</body>

</html>
