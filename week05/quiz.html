<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basis Quiz Form</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
  <main class="box">
    <h1>✅ Basic HTML and CSS Quiz</h1>
    <form class="box">
      <div class="quiz-item box">
        <label for="q1">1. What does HTML stand for?</label>
        <input type="text" id="q1" name="q1" required>
      </div>
      <div class="quiz-item box">
        <label for="q2">2. What symbol is used to select a class in CSS?</label>
        <textarea id="q2" name="q2"></textarea>
      </div>
      <div class="quiz-item box">
        <label for="q3">3. Which of the following is a valid CSS property?</label>
        <select id="q3" name="q3">
          <option value="" selected disabled>Choose one ...</option>
          <option value="a">color</option>
          <option value="b">text-style</option>
          <option value="c">font-coloring</option>
        </select>
      </div>
      <div class="quiz-item box">
        <label for="q4">4. What is the top margin given this declaration?</label>
        <code class="box">margin: 10px 5px 15px;</code>
        <input type="number" id="q4" name="q4">
      </div>
      <button type="submit">Submit Quiz</button>
    </form>
  </main>
</body>

</html>
